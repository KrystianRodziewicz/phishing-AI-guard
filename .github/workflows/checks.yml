name: Project checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Check extension types
        working-directory: extension
        run: npm run compile

      - name: Run available URL tests
        shell: bash
        run: |
          shopt -s nullglob
          tests=(
            extension/tests/*.test.mjs
            detection-ml/rules-ts/*.test.mjs
            detection-ml/benchmarks/*.test.mjs
          )

          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No test files found"
            exit 1
          fi

          printf 'Test file: %s\n' "${tests[@]}"
          node --experimental-strip-types --test "${tests[@]}"

      - name: Check adapter types
        if: ${{ hashFiles('detection-ml/rules-ts/url-warning-adapter.ts') != '' }}
        working-directory: extension
        run: >
          npx tsc --noEmit --strict
          --target ES2022
          --module ESNext
          --moduleResolution Bundler
          --allowImportingTsExtensions
          ../detection-ml/rules-ts/url-warning-adapter.ts

      - name: Build Chrome extension
        working-directory: extension
        run: npm run build
